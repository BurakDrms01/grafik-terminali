<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grafik Terminali</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23262624'/%3E%3Cpath d='M9 7v18' stroke='%23d97757' stroke-width='2'/%3E%3Crect x='6' y='11' width='6' height='9' rx='1.5' fill='%23d97757'/%3E%3Cpath d='M16 5v20' stroke='%23e9b44c' stroke-width='2'/%3E%3Crect x='13' y='8' width='6' height='11' rx='1.5' fill='%23e9b44c'/%3E%3Cpath d='M23 9v17' stroke='%235ba4c9' stroke-width='2'/%3E%3Crect x='20' y='14' width='6' height='8' rx='1.5' fill='%235ba4c9'/%3E%3C/svg%3E"
    />
    <script>
      // Tema sayfa çizilmeden seçilsin (açılışta renk sıçraması olmasın). Varsayılan: aydınlık.
      (function () {
        var t = null;
        var a = null;
        try {
          // Yeni arayüze geçişte bir kez aydınlık temaya alınır; sonra kullanıcının seçimi geçerli.
          if (localStorage.getItem('gt.v1.themeVersion') !== '2') {
            localStorage.setItem('gt.v1.theme', JSON.stringify('light'));
            localStorage.setItem('gt.v1.themeVersion', '2');
          }
          t = JSON.parse(localStorage.getItem('gt.v1.theme'));
          a = JSON.parse(localStorage.getItem('gt.v1.accent'));
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
        document.documentElement.setAttribute('data-accent', a === 'blue' ? 'blue' : 'coral');
      })();
    </script>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand" title="Grafik Terminali">
          <svg viewBox="0 0 28 28" aria-hidden="true">
            <rect width="28" height="28" rx="7" style="fill:var(--accent-soft)" />
            <path d="M8 6v16" style="stroke:var(--accent)" stroke-width="1.6" stroke-linecap="round" />
            <rect x="5.5" y="10" width="5" height="8" rx="1.2" style="fill:var(--accent)" />
            <path d="M14 4v18" style="stroke:var(--up)" stroke-width="1.6" stroke-linecap="round" />
            <rect x="11.5" y="7" width="5" height="10" rx="1.2" style="fill:var(--up)" />
            <path d="M20 8v15" style="stroke:var(--down)" stroke-width="1.6" stroke-linecap="round" />
            <rect x="17.5" y="12" width="5" height="7" rx="1.2" style="fill:var(--down)" />
          </svg>
          <span>Grafik Terminali</span>
        </div>
        <div class="sep"></div>
        <button id="sym-btn" class="sym-btn" title="Sembol ara (klavyeden yazmaya başlayın)">
          <span class="sym-search-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20 20"/></svg></span>
          <span id="sym-ticker">…</span>
          <span id="sym-name" class="muted"></span>
        </button>
        <button id="btn-compare" class="tb-btn icon" title="Sembol karşılaştır veya ekle" aria-label="Sembol karşılaştır">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
        </button>
        <div class="sep"></div>
        <div id="intervals" class="intervals"></div>
        <div class="sep"></div>
        <button id="btn-charttype" class="tb-btn icon" title="Grafik türü" aria-label="Grafik türü"></button>
        <div class="sep"></div>
        <button id="btn-indicators" class="tb-btn" title="Göstergeler">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5.5c-1.6-.6-3 .2-3.3 2L6 18c-.3 1.8-1.7 2.6-3.3 2"/><path d="M4.5 10.5h7"/><path d="M13 10l7 8M20 10l-7 8"/></svg>
          <span class="tb-label">Göstergeler</span>
        </button>
        <div class="sep"></div>
        <button id="btn-alert" class="tb-btn" title="Alarm ekle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="7"/><path d="M12 9.5V13l2.5 1.5M4 5l3-2.5M20 5l-3-2.5"/></svg>
          <span class="tb-label">Alarm</span>
        </button>
        <button id="btn-replay" class="tb-btn" title="Tekrar oynat (bar replay)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5v14"/><path d="M8 6l11 6-11 6z"/></svg>
          <span class="tb-label">Tekrar oynat</span>
        </button>
        <div class="sep"></div>
        <button id="btn-undo" class="tb-btn icon" title="Geri al (Ctrl+Z)" aria-label="Geri al" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>
        </button>
        <button id="btn-redo" class="tb-btn icon" title="Yinele (Ctrl+Y)" aria-label="Yinele" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg>
        </button>
        <div class="spacer"></div>
        <span id="feed-status" class="feed-status"></span>
        <div class="sep"></div>
        <button id="btn-theme" class="tb-btn icon" title="Görünüm: aydınlık / karanlık tema" aria-label="Görünüm">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg>
        </button>
        <button id="btn-settings" class="tb-btn icon" title="Grafik ayarları" aria-label="Grafik ayarları">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
        <button id="btn-full" class="tb-btn icon" title="Tam ekran" aria-label="Tam ekran">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
        <button id="btn-shot" class="tb-btn icon" title="Ekran görüntüsü indir" aria-label="Ekran görüntüsü">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h3L9 5h6l1.5 2h3A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.5"/></svg>
        </button>
      </header>
      <nav id="drawbar" aria-label="Çizim araçları"></nav>
      <main id="chart-wrap">
        <div id="chart"></div>
        <div id="chart-msg" class="chart-msg" hidden></div>
        <footer id="bottombar" aria-label="Tarih aralığı ve ölçek"></footer>
      </main>
      <aside id="side" data-panel="watchlist">
        <section id="watchlist" class="panel"></section>
        <section id="alerts" class="panel"></section>
        <section id="objects" class="panel"></section>
      </aside>
      <nav id="widgetbar" aria-label="Paneller">
        <button class="wb-btn" data-panel="watchlist" title="İzleme listesi" aria-label="İzleme listesi">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/></svg>
        </button>
        <button class="wb-btn" data-panel="alerts" title="Alarmlar" aria-label="Alarmlar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="7"/><path d="M12 9.5V13l2.5 1.5M4 5l3-2.5M20 5l-3-2.5"/></svg>
          <span id="alert-badge" class="wb-badge"></span>
        </button>
        <button class="wb-btn" data-panel="objects" title="Nesne ağacı" aria-label="Nesne ağacı">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 12.5l9 5 9-5M3 17l9 5 9-5"/></svg>
        </button>
        <span class="wb-spacer"></span>
        <button class="wb-btn" id="btn-keys" title="Klavye kısayolları (?)" aria-label="Klavye kısayolları">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 10h.01M9.5 10h.01M13 10h.01M16.5 10h.01M7 14h10"/></svg>
        </button>
      </nav>
    </div>
    <div id="toasts" aria-live="polite"></div>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
